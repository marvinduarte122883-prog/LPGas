name: Generate FiestaFlow DOCX

on:
  push:
    paths:
      - 'create_project_summary.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'create_project_summary.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Generate DOCX
        run: |
          mkdir -p output
          python create_project_summary.py output/FiestaFlow_Project_Summary.docx

      - name: Upload generated DOCX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiestaFlow_Project_Summary
          path: output/FiestaFlow_Project_Summary.docx
